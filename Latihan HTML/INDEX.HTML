<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Layout Website</title>
<style>
  body {
    font-family: Times New Roman, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px;
    background: #fff;
  }
  table {
    border-collapse: collapse;
    width: 700px;
  }
  td {
    border: 1px solid #333;
    text-align: center;
    vertical-align: middle;
    padding: 10px;
  }
  .header {
    background-color: #fde3c4;
    height: 50px;
    font-weight: bold;
  }
  .nav {
    background-color: #d6e4f7;
    height: 30px;
  }
  .content {
    background-color: #f5d3d3;
    text-align: left;
    vertical-align: top;
    padding: 20px;
    height: 220px;
  }
  .sidebar {
    background-color: #d9e8d3;
    text-align: left;
    vertical-align: top;
    padding: 15px;
    width: 150px;
  }
  .footer {
    background-color: #fde3c4;
    height: 40px;
  }
  h1 {
    margin: 0 0 10px 0;
    font-size: 28px;
  }
  p {
    margin: 0;
    line-height: 1.5;
  }
  .sidebar ul {
    padding-left: 18px;
  }
    margin: 5px 0 0 0;
  .sidebar strong {
    display: block;
    margin-bottom: 5px;
  }
</style>
</head>
<body>

<table>
  <tr>
    <td class="header" colspan="2">HEADER</td>
  </tr>
  <tr>
    <td class="nav" colspan="2">NAVIGASI</td>
  </tr>
  <tr>
    <td class="content">
      <h1>Heading 1</h1>
      <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
    </td>
    <td class="sidebar">
      <strong>Menu:</strong>
      <ul>
        <li>Home</li>
        <li>Berita</li>
        <li>Layanan</li>
        <li>Kontak</li>
      </ul>
    </td>
  </tr>
  <tr>
    <td class="footer" colspan="2">FOOTER</td>
  </tr>
</table>

</body>
</html>
