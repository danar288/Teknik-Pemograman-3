<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan_Web03</title>
    <link rel="stylesheet" href="asset/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar-section" id="home">
        <div class="navbar__inner">
            <nav class="nav-links" id="navLinks">
                <a href="#home">Beranda</a>
                <a href="#service">Service</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>

            <div class="brand">
                <div class="logo">
                    <img src="asset/img/harley.webp" alt="Logo">
                </div>
                <span class="brand__name">Nufan Garage</span>
            </div>

            <button class="nav-toggle" id="navToggle" aria-label="Buka menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <section class="hero-section">
        <div class="hero__inner">
            <div class="hero-content">
                <h1>Judul Hero di Sini</h1>
                <p>Teks pendukung di sini.</p>
            </div>
        </div>
    </section>

    <section class="service-section" id="service">
        <div class="section-inner">
            <h2>Service</h2>
            <p>Konten service diletakkan di sini.</p>
        </div>
    </section>

    <section class="about-section" id="about">
        <div class="section-inner">
            <h2>About</h2>
            <p>Konten about diletakkan di sini.</p>
        </div>
    </section>

    <section class="contact-section" id="contact">
        <div class="section-inner">
            <h2>Contact</h2>
            <p>Konten contact diletakkan di sini.</p>
        </div>
    </section>

    <script src="Asset/js/bootstrap.bundle.min.js"></script>
    <script>
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');

        navToggle.addEventListener('click', () => {
            const isOpen = navLinks.classList.toggle('is-open');
            navToggle.classList.toggle('is-active', isOpen);
            navToggle.setAttribute('aria-expanded', isOpen);
        });

        // Tutup menu otomatis saat salah satu link diklik (khusus mobile)
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('is-open');
                navToggle.classList.remove('is-active');
                navToggle.setAttribute('aria-expanded', 'false');
            });
        });
    </script>
</body>
</html>
