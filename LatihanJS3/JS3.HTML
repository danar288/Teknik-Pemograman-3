<!DOCTYPE html>
<html>
<head>
    <title>Second Stopwatch</title>
</head>
<body>
    <h1>Javascript Stopwatch</h1>
    <h2 id="display">00 : 00 : 00 : 000</h2>
    <!-- Tombol -->
    <button onclick="startStopwatch()">Start</button>
    <button onclick="stopStopwatch()">Stop</button>
    <button onclick="resetStopwatch()">Reset</button>

    <script>
        let milliseconds = 0;
        let seconds = 0;
        let minutes = 0;
        let hours = 0;

        let timer = null;
  
        function startStopwatch() {
            if (timer === null) {
                timer = setInterval(function() {
                    milliseconds++;
                    if (milliseconds >= 1000) {
                        milliseconds = 0;
                        seconds++;
                    }
                    if (seconds >= 60) {
                        seconds = 0;
                        minutes++;
                    }
                    if (minutes >= 60) {
                        minutes = 0;
                        hours++;
                    }
                    document.getElementById("display").innerHTML =
                        formatTime(hours) + " : " +
                        formatTime(minutes) + " : " +
                        formatTime(seconds) + " : " +
                        formatMilliseconds(milliseconds);

                }, 1);

            }
        }

        function stopStopwatch() {
            clearInterval(timer);
            timer = null;
        }
        function resetStopwatch() {
            clearInterval(timer);
            timer = null;
            milliseconds = 0;
            seconds = 0;
            minutes = 0;
            hours = 0;
            document.getElementById("display").innerHTML =
                "00 : 00 : 00 : 000";
        }

        function formatTime(time) {
            if (time < 10) {
                return "0" + time;
            }
            return time;
        }
        function formatMilliseconds(time) {
            if (time < 10) {
                return "00" + time;
            }
            if (time < 100) {
                return "0" + time;
            }

            return time;
        }

    </script>
</body>
</html>
